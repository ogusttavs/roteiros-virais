name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roteiros
          POSTGRES_PASSWORD: roteiros
          # "postgres", nunca "roteiros": resetarSchema recusa o nome exato "roteiros" desde a
          # etapa 11 (o banco de trabalho local, com dado real que custou credito de API).
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roteiros"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://roteiros:roteiros@localhost:5432/postgres
      AI_PROVIDER: mock
      APP_NAME: "seu painel"
      BETTER_AUTH_SECRET: ci-secret-nao-e-producao
      JOBS_API_KEY: ci-secret-nao-e-producao

    steps:
      # fetch-depth: 0 (historico inteiro, nao so o commit do evento): checar-versao-prompt
      # (etapa 18, decisao 5) precisa de origin/main para comparar, e o clone raso padrao
      # nao traz esse ref.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      # e2e roda contra o build de producao (next start), nao o next dev
      # (etapa 13, parte 3, decisao 2 do PROXIMO.md): builda aqui, uma vez,
      # e PLAYWRIGHT_SEM_BUILD faz o webServer do playwright.config.ts so
      # iniciar o servidor com o que ja foi construido, sem buildar de novo.
      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
        env:
          PLAYWRIGHT_SEM_BUILD: "1"

      - run: npm run checar-texto

      - run: npm run checar-tokens

      - run: npm run checar-versao-prompt
