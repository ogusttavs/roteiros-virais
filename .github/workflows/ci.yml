name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roteiros
          POSTGRES_PASSWORD: roteiros
          POSTGRES_DB: roteiros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roteiros"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://roteiros:roteiros@localhost:5432/roteiros
      AI_PROVIDER: mock
      APP_NAME: "seu painel"
      BETTER_AUTH_SECRET: ci-secret-nao-e-producao
      JOBS_API_KEY: ci-secret-nao-e-producao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run checar-texto

      - run: npm run build
