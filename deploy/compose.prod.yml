# Compose de producao (etapa 13). Copiado para /srv/roteiros/docker-compose.yml
# pelo deploy/deploy.sh. Segue _compartilhado/INFRA-VPS.md: nomes com prefixo
# roteiros-, nenhuma porta publicada, rede externa `web` so para o app (o Caddy
# compartilhado fala com ele pelo nome), rede interna para o banco, restart
# unless-stopped em tudo, limite de memoria por servico, volumes nomeados
# proprios. Segredos vem de /srv/roteiros/.env (chmod 600, nunca no git).

name: roteiros

services:
  roteiros-postgres:
    image: postgres:16-alpine
    container_name: roteiros-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: roteiros
      POSTGRES_DB: roteiros
      # POSTGRES_PASSWORD vem do .env e e a mesma senha da DATABASE_URL
    volumes:
      - roteiros_pg:/var/lib/postgresql/data
    networks:
      - roteiros-interna
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roteiros -d roteiros"]
      interval: 10s
      timeout: 5s
      retries: 10

  roteiros-app:
    image: ghcr.io/ogusttavs/roteiros-virais/app:${TAG:-latest}
    container_name: roteiros-app
    restart: unless-stopped
    env_file: .env
    # E19b: o video de uma publicacao pelo Instagram espera a Meta baixar numa pasta que o app (upload e entrega do arquivo) e o worker (conferencia, que apaga) enxergam
    # juntos: volume nomeado, mesmo caminho nos dois. PUBLICAR_PASTA_TEMP aponta para ele.
    # E47 PR 2: o volume da edicao de video (bruto por 48 h, editado por 7 dias): o app recebe e confere o video, o worker transcreve e apaga. Mesmo caminho nos dois; EDICAO_PASTA aponta para ele.
    environment:
      PUBLICAR_PASTA_TEMP: /var/publicar
      EDICAO_PASTA: /var/edicao
    volumes:
      - roteiros_publicar:/var/publicar
      - roteiros_edicao:/var/edicao
    depends_on:
      roteiros-postgres:
        condition: service_healthy
    networks:
      - web
      - roteiros-interna
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/saude"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  roteiros-worker:
    image: ghcr.io/ogusttavs/roteiros-virais/worker:${TAG:-latest}
    container_name: roteiros-worker
    restart: unless-stopped
    # env_file ja basta para YTDLP_PROXY (preparacao da viagem, item 0)
    # chegar ao worker: toda variavel do .env passa, sem precisar listar em
    # "environment:".
    env_file: .env
    # E19b: o mesmo volume do app (ver la). O worker apaga o video quando a publicacao termina e varre o que ficou velho.
    # E47 PR 2: o mesmo volume de edicao do app (ver la). O worker extrai o audio, transcreve e apaga o video no prazo.
    environment:
      PUBLICAR_PASTA_TEMP: /var/publicar
      EDICAO_PASTA: /var/edicao
    volumes:
      - roteiros_publicar:/var/publicar
      - roteiros_edicao:/var/edicao
    depends_on:
      roteiros-postgres:
        condition: service_healthy
      roteiros-pot:
        condition: service_started
    networks:
      - roteiros-interna
    mem_limit: 1500m
    # SIGTERM chama desligarComGraca (src/jobs/desligamento.ts), que espera o
    # pg-boss fechar (graceful: true, teto de 30s da propria lib). O padrao
    # do Docker (10s) mata o processo antes disso; 35s da folga pro pg-boss
    # terminar sozinho na maioria dos casos (etapa 13, decisao 3).
    stop_grace_period: 35s
    # yt-dlp e ffmpeg escrevem arquivo temporario; nada persiste fora do container
    tmpfs:
      - /tmp:size=1g

  # E47 PR 4: o render da edicao de video (a previa 540p e o video final 1080p). A MESMA imagem do worker, outro papel (outro comando): so consome a fila `renderizar-edicao`, UM video por vez. O
  # ffmpeg e o que mais gasta processador nesta maquina compartilhada com o OdontoTech; `cpus: 1.0` e a trava que impede o render de roubar o processador do painel, do worker e do outro produto
  # (tem de ser 1.0 ou menos: ver `estrategia/e47-edicao-pela-ia.md`, secao 3.2). Sem porta, so na rede interna. O volume `roteiros_edicao` e o mesmo do app e do worker: le o bruto e escreve a previa e o final.
  # A memoria cobre o ffmpeg com varias entradas do mesmo arquivo; o /tmp guarda so o arquivo de legenda e a fonte (alguns KB), entao e pequeno.
  roteiros-render:
    image: ghcr.io/ogusttavs/roteiros-virais/worker:${TAG:-latest}
    container_name: roteiros-render
    restart: unless-stopped
    command: ["node_modules/.bin/tsx", "src/jobs/worker-render.ts"]
    env_file: .env
    environment:
      EDICAO_PASTA: /var/edicao
    volumes:
      - roteiros_edicao:/var/edicao
    depends_on:
      roteiros-postgres:
        condition: service_healthy
    networks:
      - roteiros-interna
    cpus: 1.0
    mem_limit: 1500m
    # Mesmo SIGTERM do worker (desligarComGraca); o render em andamento volta para a fila sozinho ao subir de novo (`recolherRendersOrfaos`).
    stop_grace_period: 35s
    tmpfs:
      - /tmp:size=256m

  # Provedor de PO Token do YouTube (transcricao do YouTube, rodada 2, item
  # 1): so na rede interna, sem porta publicada (o worker fala com ele por
  # nome de servico, `config.transcricao.potBaseUrl`, `http://roteiros-pot:
  # 4416`). Imagem oficial do projeto (github.com/Brainicism/
  # bgutil-ytdlp-pot-provider), versao fixa como o resto das dependencias
  # externas deste Compose (achado da rodada 1: versao "latest" muda sozinha
  # a cada rebuild sem passar por revisao).
  roteiros-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    container_name: roteiros-pot
    restart: unless-stopped
    networks:
      - roteiros-interna
    mem_limit: 256m

  roteiros-backup:
    image: ghcr.io/ogusttavs/roteiros-virais/backup:${TAG:-latest}
    container_name: roteiros-backup
    restart: unless-stopped
    env_file: .env
    depends_on:
      roteiros-postgres:
        condition: service_healthy
    networks:
      - roteiros-interna
    volumes:
      - roteiros_backups:/backups
    mem_limit: 256m

networks:
  web:
    external: true
  roteiros-interna:
    name: roteiros-interna

volumes:
  roteiros_pg:
    name: roteiros_pg
  roteiros_publicar:
    name: roteiros_publicar
  roteiros_edicao:
    name: roteiros_edicao
  roteiros_backups:
    name: roteiros_backups
